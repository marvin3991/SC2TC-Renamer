name: Windows tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test release tooling
        shell: pwsh
        run: |
          chcp 65001 > $null
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Release tool checks failed.' }
      - name: Install Rust with format and lint tools
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - name: Check Rust formatting and warnings
        shell: pwsh
        run: |
          chcp 65001 > $null
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed.' }
          cargo clippy --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Rust lint failed.' }
      - name: Test Rust core, UI events and dictionary updates
        shell: pwsh
        run: |
          chcp 65001 > $null
          cargo test --locked -- --test-threads=1
      - name: Verify MediaWiki-only dependencies and license inventory
        shell: pwsh
        run: |
          chcp 65001 > $null
          python scripts/collect-licenses.py
          if ($LASTEXITCODE -ne 0) { throw 'License inventory collection failed.' }
          $changed = git status --porcelain -- licenses
          if ($LASTEXITCODE -ne 0) { throw 'git status failed.' }
          if ($changed) { Write-Output $changed; throw 'licenses/ is out of date; run scripts/collect-licenses.py and commit the result.' }
      - name: Verify Rust standalone file operations
        shell: pwsh
        run: |
          chcp 65001 > $null
          cargo run --locked -- --self-test work/ci-rust-self-check
          Get-Content -LiteralPath work/ci-rust-self-check/verification.json -Encoding UTF8
