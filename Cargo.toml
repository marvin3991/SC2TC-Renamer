[package]
name = "sc2tc-renamer"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "Offline Chinese filename conversion with preview and recovery"
publish = false
# This license covers author-owned source; bundled tables have separate terms.
license = "Apache-2.0"

[package.metadata.distribution]
author-source-license = "Apache-2.0"
combined-binary-license = "GPL-3.0-only"
mediawiki-table-license = "GPL-2.0-or-later"

[lib]
name = "sc2tc_renamer"
path = "src/lib.rs"

[[bin]]
name = "SC2TC-Renamer"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:image"]

[dependencies]
anyhow = "=1.0.102"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
csv = "=1.4.0"
chrono = { version = "=0.4.45", features = ["clock"], default-features = false }
uuid = { version = "=1.27.0", features = ["v4"] }
sha2 = "=0.11.0"
zhconv = { version = "=0.4.2", default-features = false, features = ["mediawiki-hant", "mediawiki-tw"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
tar = { version = "=0.4.46", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"], optional = true }
rfd = { version = "=0.17.2", optional = true }
image = { version = "=0.25.9", default-features = false, features = ["png", "ico"], optional = true }

[build-dependencies]
winresource = "=0.1.31"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
